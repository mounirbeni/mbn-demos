<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ATLAS DRIVE — Rental management · Demo</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b1220" />
<link rel="icon" href="/demos/rent/icon.svg" type="image/svg+xml" />
<link rel="preload" href="/demos/rent/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/demos/rent/css/fonts.css" />
<link rel="stylesheet" href="/demos/rent/css/admin.css" />
</head>
<body>
<div class="gate" id="gate">
  <form class="gate-card" id="gateForm">
    <div class="g-brand"><img src="/demos/rent/icon.svg" alt="" width="44" height="44" /><div><b>ATLAS DRIVE</b><span>Rental management</span></div></div>
    <label for="pin">Enter your PIN</label>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]*" />
    <p class="g-hint" id="pinHint" hidden></p>
    <p class="g-err" id="pinErr" role="alert"></p>
    <button class="btn pri" type="submit">Unlock</button>
    <a class="g-back" href="/demo/rent">← Back to the website</a>
  </form>
  <div class="gate-card" id="gateOff" hidden role="alert"><div class="g-brand"><img src="/demos/rent/icon.svg" alt="" width="44" height="44" /><div><b>ATLAS DRIVE</b></div></div><h1 id="offTitle"></h1><p id="offBody"></p></div>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="s-brand"><img src="/demos/rent/icon.svg" alt="" width="34" height="34" /><div><b id="coName">Atlas Drive</b><small>Rental management</small></div></div>
    <nav class="tabs" id="tabs" aria-label="Dashboard"></nav>
    <div class="s-foot"><a href="/demo/rent" target="_blank" rel="noopener">View website ↗</a><span class="demo-tag">Demo by MBN DEV</span></div>
  </aside>
  <main class="main">
    <header class="top"><div><h1 id="pageTitle"></h1><p id="pageSub"></p></div><div class="top-r"><span class="live"><i></i>Live</span><button class="btn pri sm" id="newBtn" type="button">+ New booking</button></div></header>
    <section id="view"></section>
  </main>
</div>
<div class="amodal" id="amodal" role="dialog" aria-modal="true" hidden></div>
<div class="atoast" id="atoast" role="status" aria-live="polite"></div>
<script type="module" src="/demos/rent/js/admin.js"></script>
</body>
</html>
